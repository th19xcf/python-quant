[tool.poetry]
name = "china-stock-quant"
version = "0.1.0"
description = "中国股市量化分析系统"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
# 数据处理
pandas = "==3.1.0"
polars = "==2.0.0"
numpy = "==2.5.4"
# 数据获取
akshare = "==1.19.3"
requests = "==2.34.2"
beautifulsoup4 = "==4.15.0"
# 技术分析
ta = "==0.11.0"
numba = "==0.68.0"
# UI框架
pyside6 = "==6.12.0"
pyqtgraph = "==0.14.0"
plotly = "==7.1.0"
# 数据库
pymysql = "==1.2.3"
sqlalchemy = "==2.1.6"
# 配置管理
pydantic = "==2.14.1"
pydantic-settings = "==2.16.1"
# 事件总线
blinker = "==1.9.0"
# 日志管理
loguru = "==0.7.3"
# 拼音处理
pypinyin = "==0.55.0"
# 科学计算（FactorEvaluator 依赖）
scipy = "==1.18.1"

[tool.poetry.group.dev.dependencies]
# 测试
pytest = "==9.1.1"
pytest-cov = "==7.1.0"
coverage = "==7.17.0"
# 静态检查
ruff = "==0.17.2"
mypy = "==2.4.0"
# 代码格式化
black = "==26.10.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(\.
    |build
    |dist
    |venv
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff.lint]
# 首期只开"必然是真错误"的规则：语法错误、无效比较、未定义名称
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.14"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
files = ["src/backtest/engine/execution_core.py"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 39
show_missing = true
skip_covered = true
