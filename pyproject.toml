[tool.poetry]
name = "china-stock-quant"
version = "0.1.0"
description = "中国股市量化分析系统"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
# 项目代码位于顶层 src/ 目录（不是以项目名命名的包），必须显式声明，
# 否则 poetry build 会按 china-stock-quant 去找同名目录并直接失败。
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = ">=3.14,<3.16"
# 数据处理
pandas = "==3.1.0"
polars = "==2.1.0"
numpy = "==2.5.4"
# 数据获取
akshare = "==1.20.21"
# 申万行业/ST 名称等自建采集器的顶层 HTTP 依赖，不能只靠 akshare 传递带入
requests = "^2.34.2"
# AkShare 元数据只声明 mini-racer，但其代码 import 的是 py_mini_racer；
# 缺包会导致 `import akshare` 直接失败（表现为东财接口 RemoteDisconnected）
py-mini-racer = "==0.6.0"
# Tushare：ST 名称史、指数月度权重等采集器直接 import，此前仅在虚拟环境里手工装过、未声明
tushare = "^1.4.29"
# 技术分析
numba = "==0.68.1"
# UI框架
pyside6 = "==6.12.0"
pyqtgraph = "==0.14.0"
plotly = "==7.1.0"
# 数据库
pymysql = "==1.2.3"
sqlalchemy = "==2.1.6"
# 配置管理
pydantic = "==2.14.2"
pydantic-settings = "==2.16.2"
# 事件总线
blinker = "==1.9.0"
# 日志管理
loguru = "==0.7.3"
# 拼音处理
pypinyin = "==0.55.0"
# 科学计算（FactorEvaluator 依赖）
scipy = "==1.18.1"
# 系统监控（src/utils/memory_manager.py 运行时依赖，不可放入 dev 组）
psutil = "==7.2.2"
alembic = "==1.20.1"
# PDF 表格抽取（tools/fetch_etf_fee.py 抽 ETF 产品资料概要费率表、
# tools/rebuild_index_constituents.py 抽指数成分调整公告，均为正式数据产出）。
# 两处都是函数内 import 且无 ImportError 兜底：缺包时一支直接抛栈，
# 另一支被 except Exception 吞成 errors 记录，比崩更危险，故按 == 钉在 main 组。
pdfplumber = "==0.11.10"

[tool.poetry.group.dev.dependencies]
# 测试
pytest = "==9.2.0"
pytest-cov = "==7.1.0"
coverage = "==7.17.0"
# 静态检查
ruff = "==0.17.3"
mypy = "==2.4.1"
# 代码格式化
black = "==26.10.1"
# 测试环境依赖：Polars/pandas 转换测试需要 pyarrow
pyarrow = "==26.0.0"

[tool.poetry.group.baostock]
# 可选组：BaoStock 在线数据源（`poetry install --with baostock`）
# 未安装时 BaostockHandler 不会被注册，相关契约测试自动跳过
optional = true

[tool.poetry.group.baostock.dependencies]
baostock = "==0.9.4"

[tool.poetry.group.gpu]
# 可选组：仅有 CUDA 环境才需要安装
# 未安装时 src/tech_analysis/gpu_acceleration.py 会自动降级为 NumPy（cp = np）
optional = true

[tool.poetry.group.gpu.dependencies]
# Pin 变体分发而不是 cupy 裸名：PyPI 的 cupy 14.2.0 只发布 sdist
# （cupy-14.2.0.tar.gz，无任何 wheel），Windows + cp314 只能源码编译 CUDA 扩展、
# 实际装不上；cupy-cuda12x 14.2.0 提供 cp314-cp314-win_amd64.whl，
# 且 import 名仍是 cupy，代码侧无需改动。CUDA 13.x 环境可换 cupy-cuda13x。
cupy-cuda12x = "==14.2.0"

[tool.poetry.group.analytics]
# 可选组：只读分析层（Alphalens 因子评估 + QuantStats 绩效 tearsheet）
# `poetry install --with analytics` 才安装；默认 `poetry install` 不受影响，
# 缺失时适配层抛 ImportError 并以「可选能力不可用」提示，不影响回测主流程
optional = true

[tool.poetry.group.analytics.dependencies]
alphalens-reloaded = "0.5.1"
quantstats = "0.0.86"

[tool.poetry.group.learning]
# 可选组：自学习 L2 的 LightGBM 对照（`poetry install --with learning`）
# 默认安装不受影响；缺失时学习管道自动跳过 LightGBM，仅保留
# 等权 / IC / ICIR / Ridge（Ridge 由 NumPy 闭式解实现，无需 sklearn）
optional = true

[tool.poetry.group.learning.dependencies]
lightgbm = "==4.6.0"
scikit-learn = "^1.5"

[tool.poetry.group.tdx]
# 可选组：通达信本地数据解析（`poetry install --with tdx`）
# 仅 tools/verify_rights_issue.py --source gbbq 需要；用于解密 hq_cache/gbbq
# 权息库作为配股事件的独立核验源。默认安装不受影响。
optional = true

[tool.poetry.group.tdx.dependencies]
pytdx = "==1.72"
# research/mootdx/ 下的通达信服务器探测脚本直接 import mootdx / tdxpy。
# mootdx 同时是 httpx(<0.26.0) / tenacity(<9.0.0) / prettytable 的唯一入口：
# 不声明它，这些传递包就永远进不了 poetry.lock，.venv 与 lock 会持续漂移。
# 只服务研究探针，不进 main；且 tenacity 与 httpx 受 mootdx 上界约束，不可升级。
mootdx = "==0.11.7"
tdxpy = "==0.2.7"

[[tool.poetry.source]]
name = "mirrors"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py314']
include = '\.pyi?$'
extend-exclude = '''
/(\.
    |build
    |dist
    |venv
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
# 根目录加入 sys.path：CI 用 `poetry run pytest`（控制台脚本）启动，cwd 不会自动进
# sys.path，tests 里的 `import src.*` 会 ModuleNotFoundError('src') 而在收集期全灭；
# 本机惯用 `python -m pytest` 会把 cwd 塞进 sys.path[0]，因而掩盖了这个问题。
pythonpath = ["."]
# 默认套件排除墙钟性能门禁（-m perf），避免机器负载波动导致假红；
# 性能回归请显式执行 `pytest -m perf`。
addopts = "-q -m 'not perf'"
markers = [
    "perf: 性能回归门禁（固定 seed、多次取中位数、含真实耗时断言）",
]

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff.lint]
# 全量规则集：错误 + bugbear + 盲捕异常 + bandit 安全 + 导入排序 + 现代化 + SIM 化简 + try + 复杂度
select = [
    "E",      # pycodestyle 错误
    "F",      # pyflakes（未定义名等）
    "W",      # pycodestyle 警告
    "B",      # bugbear：常见 bug（如 __iter__ 返回 None、除以变量、重复异常、有问题的默认参数等）
    "BLE",    # flake8-blind-except：禁止裸 except: 和 except Exception
    "S",      # bandit：安全（eval/exec/hashlib 弱哈希/path traversal/subprocess 硬编码 shell 等）
    "I",      # isort：导入排序
    "UP",     # pyupgrade：现代化（f-string / .format / %-format / super() 等）
    "SIM",    # flake8-simplify：代码化简（可合并 if/三元可化简/枚举比较等）
    "TRY",    # flake8-try：异常处理风格
    "C4",     # flake8-comprehensions：列表/集合/字典/元组推导式
    "PLR09",  # pylint：复杂度（函数参数过多、行数过多）
    "C901",   # mccabe：圈复杂度
    "T201",   # flake8-print：禁止 print()，统一用 logger
]
# 行宽 88 是 black 默认，项目代码历史包袱略宽；启用但不阻塞
ignore = [
    # === 历史代码债务，暂时不阻塞 ===
    "E501",       # 行过长：历史代码有大量 100~150 行，逐步收而非一刀切
    "E402",       # import 不在文件顶部：项目里有模块中间动态 import 的合理用法
    "E701",       # multiple-statements-on-one-line-colon：历史 if/for 单行风格
    "E702",       # multiple-statements-on-one-line-semicolon：同上
    "F401",       # unused-import：部分是类型 hint 延迟导入 / 插件注册导入，动态引用看不清
    "PLR0911",    # too-many-return-statements：老策略类早返回密集
    "PLR0912",    # 函数 too many branches：老策略类 if/elif 密集
    "PLR0913",    # too many arguments：策略/引擎构造函数历史包袱
    "PLR0915",    # 函数 too many statements：同上
    "PLR0917",    # too-many-positional-arguments：同上
    # === 风格建议（非 bug） ===
    "B007",       # unused-loop-control-variable：_ 前缀变量循环常见
    "SIM102",     # collapsible-if：历史风格保留
    "SIM105",     # suppressible-exception：同上
    "SIM108",     # if-else-block-instead-of-if-exp：同上
    "SIM114",     # if-with-same-arms：同上
    "SIM117",     # single-context-manager：同上
    "SIM113",     # enumerate-for-loop：同上
    "SIM300",     # yoda-conditions：同上
    "TRY002",     # raise-vanilla-class：项目 raise ValueError 等标准异常合理
    "TRY003",     # raise from：历史 except 里裸 raise 合理
    "TRY201",     # too many try statements
    "TRY300",     # try-consider-else：代码风格偏好问题
    "TRY301",     # raise-within-try：测试代码里常见
    "TRY401",     # verbose-log-message：logger 风格
    # === bandit 安全：项目无外部输入路径 ===
    "S101",       # assert 用于生产逻辑（bandit：项目内部逻辑 assert 合理）
    "S324",       # hashlib-insecure-hash-function：项目 md5/sha1 仅用于本地文件 hash 校验，非安全上下文
    "S603",       # subprocess 不设 shell=True（项目没走 subprocess）
    "S607",       # subprocess cwd 硬编码（同上）
    # === pyupgrade ===
    "UP006",      # from __future__ import annotations（py314 不需要）
    "UP007",      # from __future__ import annotations（同上）
    "UP035",      # deprecated-import：需要逐步替换的旧 import（如 yaml.load→safe_load），后续批量处理
    "B024",       # ABC 类无 abstract method：DataSourceBase/PluginBase 提供公共接口但不强制抽象
    "B027",       # ABC 里的空方法无 abstract：同上，on_config_changed 提供默认空实现
    # UP038 已被 ruff 移除，无需 ignore
]

[tool.ruff.lint.mccabe]
# 圈复杂度门限：>15 即视为待拆分函数；现存遗留处以逐函数 noqa: C901 标注，
# 随拆分巨函数后移除（不再用全局 ignore 关闭 C901）
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# 测试文件：允许 assert、允许 monkeypatch 全局
"tests/**/*.py" = ["S101", "BLE001", "TRY301"]
# 命令行工具：报告默认输出到 stdout，允许 print / 路径注入后的延迟 import
"tools/**/*.py" = ["T201", "E402"]
# UI 回调：太多方法参数 + 嵌套 if；线程/界面回调顶层必须兜底盲捕，不允许异常穿透退出事件循环
"src/ui/**/*.py" = ["PLR0913", "PLR0912", "PLR0917", "C901", "F401", "E402", "BLE001"]
# 策略文件：历史包袱的复杂度
"src/backtest/strategies/**/*.py" = ["C901", "PLR0912", "PLR0915", "PLR0917", "SIM102", "SIM105"]
# 数据库 upsert：动态 SQL 字符串拼接
"src/database/**/*.py" = ["S608", "F401", "E402"]
# 数据层 handler：历史 import 结构
"src/data/**/*handler.py" = ["E402", "F401"]
# 工具类：动态导入
"src/utils/**/*.py" = ["F401"]
# logger.py 自身的 sink 用 print 转发，属于 loguru 框架要求
"src/utils/logger.py" = ["T201"]

[tool.mypy]
python_version = "3.14"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
# 已覆盖 src 下全部业务模块；silent 表示只报告列出的目录内的错误，
# 不把尚未收口的依赖模块错误一并暴露（避免门禁被无关存量错误淹没）
files = ["src/backtest", "src/core", "src/risk", "src/api", "src/plugin", "src/alpha", "src/utils", "src/data", "src/database", "src/tech_analysis", "src/quant", "src/recommendation", "src/ui"]
follow_imports = "silent"

# 分目录加严：核心链路（回测 / 风控 / API）、数据服务层与公共工具层强制函数注解。
# 其余目录通过 tests/test_mypy_ratchet.py 的“未注解数量不增长”棘轮逐步收口。
[[tool.mypy.overrides]]
module = [
    "src.backtest.*",
    "src.risk.*",
    "src.api.*",
    "src.data.services.*",
    "src.utils.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# 棘轮：实测 63.9%，门禁只允许上调。每轮补齐测试后同步抬高，
# 防止覆盖率随新增代码悄悄回落。
fail_under = 63
show_missing = true
skip_covered = true

# 模块级覆盖率门槛（V-13）：全局 fail_under（本地 63 / CI 66）保持不变，
# 关键链路另设 ≥85% 的独立门槛，避免被其它目录的高覆盖率稀释。
# 由 tools/check_module_coverage.py 读取并判定，CI 与本地同一条命令。
# 数值只允许上调：达标的模块按实测值登记，未达标的模块不得为了让门禁变绿而调低。
[tool.coverage-gates]
modules = { "src/risk" = 85 }
# 2026-11-12 实测（本地 2736 passed，pytest --cov=src 口径）：
#   src/risk               478/503  = 95.03%  → 已登记 85
#   src/backtest          1850/2192 = 84.40%  → 差 14 行到位，待决（不登记，避免门禁立刻红）
#   src/data/local_store  1832/3034 = 60.38%  → 差 747 行，待决
