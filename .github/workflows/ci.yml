name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    # 钉死 24.04：ubuntu-latest 正在向 26.04 迁移（runner-images#14748），
    # 依赖面会随标签漂移；当前复现与验证证据都建立在 24.04 上。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.5.1
          poetry install --no-root --with dev,baostock
      - name: Lint
        run: poetry run ruff check src tests
      - name: Type check
        run: poetry run mypy src
      - name: Failure probe diagnostics
        if: always()
        run: |
          set +e
          out=$(poetry run pytest --cov=src --cov-report=term-missing 2>&1)
          echo "$out" | tail -30
          uniq=$(echo "$out" | grep -E '^E   ' | sort -u | head -6 | tr '\n' '|')
          ids=$(echo "$out" | grep -E '^(FAILED|ERROR) ' | head -30 | tr '\n' '|')
          summ=$(echo "$out" | grep -E '[0-9]+ (passed|failed)' | tail -1 | tr '\n' '|')
          echo "::error title=uniq-errors::${uniq}"
          echo "::error title=nodeids::${ids}"
          echo "::error title=summary::${summ}"
          exit 0
      - name: Test with coverage gate
        run: poetry run pytest --cov=src --cov-report=term-missing
