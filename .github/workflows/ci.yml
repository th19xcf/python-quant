name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry==2.5.1
          poetry install --no-root --with dev,baostock
      - name: Lint
        run: poetry run ruff check src tests
      - name: Type check
        run: poetry run mypy src
      - name: Collect-only diagnostics
        if: always()
        run: |
          set +e
          poetry run python -c "import PySide6.QtWidgets" > /tmp/pyside6.txt 2>&1
          imp=$(tail -3 /tmp/pyside6.txt | tr '\n' '|')
          out=$(poetry run pytest --collect-only -q 2>&1)
          echo "$out" | head -60
          errs=$(echo "$out" | grep -E '^E   |^ERROR ' | sort -u | head -20 | tr '\n' '|')
          echo "::error title=pyside6-import::${imp}"
          echo "::error title=collect-errors::${errs}"
          exit 0
      - name: Test with coverage gate
        run: poetry run pytest --cov=src --cov-report=term-missing
