# Alembic configuration.
# NOTE: keep this file ASCII-only. Alembic reads alembic.ini with the system
# locale encoding (GBK on zh-CN Windows); non-ASCII bytes cause a UnicodeDecodeError.
#
# The database URL is NOT configured here: migrations/env.py builds it at runtime
# from src/utils/config.py (.env), so credentials never live in this file.
#
# Usage (run from the project root):
#   .\.venv\Scripts\python.exe -m alembic upgrade head
#   .\.venv\Scripts\python.exe -m alembic revision --autogenerate -m "change note"
#   .\.venv\Scripts\python.exe -m alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
; placeholder only, overridden by env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
